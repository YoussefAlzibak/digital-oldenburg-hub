    <!-- SEO Meta Tags -->
    <title>Web Development, CRM & SEO Solutions | Unicum Tech</title>

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.unicum-tech.de/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Digitale Lösungen für Ihr Business | Unicum Tech" />

    <meta property="og:locale" content="de_DE" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Unicum Tech",
      "url": "https://www.unicum-tech.de",
      "logo": "https://www.unicum-tech.de/logo.png",
      "description": "Professionelle Webentwicklung, CRM-Systeme und SEO-Lösungen",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["German", "English"]
      },
      "sameAs": [
        "https://www.facebook.com/unicumtech",
        "https://www.linkedin.com/company/unicumtech"
      ]
    }
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Inter Font - Modern, readable font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
